<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real CRT Phosphor Preview __VER__</title>
<style>
:root{
  --bg:#2b2c2e; --panel:#222325; --panel2:#1b1c1e; --line:#3a3b3e; --text:#e7e5e0; --muted:#9b9993;
  --warm:#e9a35b; --band:#34353a; --save:#f2c14e; --saveHi:#ffd46b; --r:#ff5a4e; --g:#5fe08a; --b:#5b8cff; --focus:#9cc3ff;
  color-scheme: dark;
}
:root[data-theme="light"]{ --bg:#d9d8d5; --panel:#ecebe8; --panel2:#e2e1de; --line:#c3c1bc; --text:#1d1d1f; --muted:#5f5d58; --warm:#a85a12; --band:#dfded9; --save:#e0a91c; --saveHi:#f0bb32; color-scheme: light; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr auto;height:100%;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.on{background:var(--text);color:var(--panel2);border-color:var(--text)}
button:disabled{opacity:.45;cursor:default}
select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.mark{display:flex;gap:3px;height:20px}
.mark i{display:block;width:5px;border-radius:2px}
.mark i:nth-child(1){background:var(--r)}.mark i:nth-child(2){background:var(--g)}.mark i:nth-child(3){background:var(--b)}
h1{font-size:15px;font-weight:650;margin:0 12px 0 2px;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--muted);margin-left:6px}
.sp{flex:1}
main{display:grid;grid-template-columns:340px 1fr;min-height:0}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:4px 0 24px}
.grp{border-bottom:1px solid var(--line);background:var(--panel)}
.grp:nth-of-type(even){background:var(--band)}
#bSave{background:var(--save);color:#1c1606;border-color:var(--save);font-weight:650}
#bSave:hover:not(:disabled){background:var(--saveHi);border-color:var(--saveHi)}
#bSave:disabled{background:var(--panel2);color:var(--muted);border-color:var(--line);font-weight:400}
.grp>summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:650;display:flex;align-items:center;gap:8px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.grp[open]>summary::before{transform:rotate(45deg)}
.grp>summary .n{margin-left:auto;color:var(--warm);font-weight:500;font-size:12px}
.prm{padding:6px 14px 8px 28px}
.prm .top{display:flex;align-items:baseline;gap:6px}
.prm label{flex:1;font-size:13px}
.prm .ko{display:block;color:var(--muted);font-size:12px;margin:1px 0 3px}
.prm input[type=number]{width:76px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 5px;text-align:right;font-variant-numeric:tabular-nums}
.prm input[type=range]{width:100%;accent-color:var(--muted)}
.prm.chg label{color:var(--warm)}
.prm.chg input[type=range]{accent-color:var(--warm)}
.prm .rs{border:0;background:none;color:var(--muted);padding:0 2px;font-size:12px;visibility:hidden}
.prm.chg .rs{visibility:visible}
.view{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr}
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.vbar .lb{color:var(--muted);font-size:12px}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
#stage{position:relative;overflow:hidden;cursor:grab;background:#000}
#stage.drag{cursor:grabbing}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;top:8px;padding:2px 8px;border-radius:4px;background:rgba(0,0,0,.6);color:#ddd;font-size:12px;pointer-events:none}
#stage.over{outline:3px dashed var(--save);outline-offset:-6px}
#stage.split #toast, #stage.wipemode #toast{left:25%;width:min(420px,calc(50% - 32px))}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--save);border-radius:10px;padding:14px 16px 14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:5}
#toast h2{font-size:15px;margin:0 0 4px;padding-right:24px}
#toast p{margin:0 0 10px;color:var(--muted);font-size:13px}
#toast .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#toast .x{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px}
#toast .x:hover{color:var(--text)}
@media (prefers-reduced-motion:no-preference){#toast{animation:tin .35s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}}
#crop{position:absolute;inset:0;background:var(--bg);z-index:8;display:grid;grid-template-rows:auto 1fr}
#crop .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#crop .bar .msg{color:var(--muted);font-size:13px;margin-right:auto}
#crop .area{position:relative;overflow:hidden;cursor:crosshair}
#cropCv{position:absolute;image-rendering:pixelated}
#cropBox{position:absolute;border:2px solid var(--save);box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none}
/* tools menu */
.menu{position:relative}
.pop{position:absolute;top:calc(100% + 4px);right:0;z-index:20;display:flex;flex-direction:column;gap:4px;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pop button{text-align:left}
/* panel top bar: simple/full, undo, redo, reset */
.sidebar{position:sticky;top:0;z-index:3;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.sidebar .seg button{padding:5px 10px}
.sidebar .ib{padding:5px 9px}
#side.simple .grp>summary{display:none}
#side.simple .grp{border-bottom:0;background:var(--panel)}
#side.simple .prm:not(.key){display:none}
#side.simple .prm.key{padding-left:14px}
.more{display:none;padding:10px 14px;color:var(--muted);font-size:12px}
#side.simple .more{display:block}
/* wipe compare */
#wipe{position:absolute;top:0;bottom:0;width:0;pointer-events:none;z-index:4}
#wipe::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--save)}
#wipe i{position:absolute;top:50%;left:-17px;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:var(--save);color:#1c1606;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#stage.wiping{cursor:ew-resize}
#fsHint{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#eee;padding:8px 14px;border-radius:8px;font-size:14px;z-index:6;pointer-events:none;transition:opacity .6s}
#fsHint.fade{opacity:0}
#stage:fullscreen{background:#000}
footer{display:flex;gap:18px;flex-wrap:wrap;padding:7px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
footer b{color:var(--text);font-weight:600}
footer .warn{color:var(--warm)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;max-width:520px;padding:20px 22px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 10px}
dialog .row{display:flex;gap:8px;align-items:center;margin:8px 0}
dialog input[type=number],dialog input[type=text]{width:90px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
dialog input[type=text]{width:100%}
dialog p{color:var(--muted);margin:6px 0}
dialog .where{display:block;margin:5px 0;font-size:13px;cursor:pointer}
dialog .where code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
dialog pre{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:200px;overflow:auto;font-size:12px}
.hid{display:none!important}
@media (max-width:820px){ main{grid-template-columns:1fr;grid-template-rows:45% 55%} aside{border-right:0;border-bottom:1px solid var(--line)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1><span data-i="title"></span><small>__VER__</small></h1>
  <button id="bOpen" data-i="open"></button>
  <button id="bRef" disabled data-i="openRef"></button>
  <span class="sp"></span>
  <label class="lb" for="selPreset" data-i="startPreset"></label>
  <select id="selPreset"></select>
  <button id="bImport" data-i="import"></button>
  <button id="bSave" disabled data-i="save"></button>
  <div class="menu" id="mSave"><button id="bPng" disabled aria-haspopup="true" aria-expanded="false"><span data-i="png"></span> ▾</button>
    <div class="pop hid" id="savePop" role="menu">
      <button id="bPngFull" data-i="pngFull" data-it="pngFullTip"></button>
      <button id="bPngCmp" data-i="pngCmp" data-it="pngCmpTip"></button>
      <button id="bPngView" data-i="pngView" data-it="pngViewTip"></button>
    </div></div>
  <button id="bLang" title="Language / 언어">한국어</button>
  <input type="file" id="fImg" accept="image/*" class="hid">
  <input type="file" id="fRef" accept="image/*" class="hid">
  <input type="file" id="fPreset" accept=".slangp,.txt" class="hid">
</header>
<main>
  <aside id="side"></aside>
  <section class="view">
    <div class="vbar">
      <span class="lb" data-i="zoom"></span>
      <div class="seg" id="segZoom">
        <button data-z="1" class="on" data-it="z1Tip">1:1</button><button data-z="2" data-it="zNTip">2×</button><button data-z="4" data-it="zNTip">4×</button><button data-z="8" data-it="zNTip">8×</button>
      </div>
      <button id="bFull" data-it="fullTip">⛶ <span data-i="fullBtn"></span></button>
      <span class="lb" data-i="view"></span>
      <div class="seg" id="segMode">
        <button data-m="wipe" class="on" data-i="wipe" data-it="wipeTip"></button><button data-m="split" data-i="split"></button><button data-m="single" data-i="single"></button><button data-m="hold" data-i="hold" data-it="holdTip"></button>
      </div>
      <label class="lb" for="selSystem" data-i="system"></label>
      <select id="selSystem" disabled></select>
      <div class="seg hid" id="segLeft" data-it="leftTip">
        <button data-l="orig" class="on" data-i="lOrig"></button><button data-l="ref" data-i="lRef"></button>
      </div>
      <div class="menu" id="mTools"><button id="bTools" aria-haspopup="true" aria-expanded="false"><span data-i="tools"></span> ▾</button>
        <div class="pop hid" id="toolsPop" role="menu">
          <button id="bSize" data-i="size"></button>
          <button id="bCrop" disabled data-i="crop" data-it="cropTip"></button>
          <button id="bFind" disabled data-i="find" data-it="findTip"></button>
          <button id="bShare" data-i="share" data-it="shareTip"></button>
        </div></div>
      <span class="sp"></span>
      <span class="lb" id="dprInfo"></span>
    </div>
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="wipe" class="hid"><i>◀▶</i></div>
      <div id="fsHint" class="hid" data-i="fsHint"></div>
      <span class="cap" id="capL" style="left:8px"></span>
      <span class="cap" id="capR" style="right:8px"></span>
      <div id="crop" class="hid">
        <div class="bar"><span class="msg" data-i="cropMsg"></span>
          <button id="bCropAll" data-i="cropAll"></button><button id="bCropCancel" data-i="cancel"></button><button id="bCropOk" class="on" data-i="cropOk" disabled></button></div>
        <div class="area" id="cropArea"><canvas id="cropCv"></canvas><div id="cropBox" class="hid"></div></div>
      </div>
      <div id="toast" role="status" class="hid">
        <button class="x" id="bToastX" aria-label="close">×</button>
        <h2 data-i="tTitle"></h2>
        <p data-ih="tBody"></p>
        <div class="acts"><button id="bOpen2" class="on" data-i="open"></button><button id="bToastOk" data-i="tLater"></button></div>
      </div>
    </div>
  </section>
</main>
<footer id="info"><span data-i="infoEmpty"></span></footer>

<dialog id="dlgSize">
  <h3 data-i="size"></h3>
  <p data-i="sizeP"></p>
  <div class="row"><span style="width:130px" data-i="natRes"></span><input type="number" id="nW" min="16" max="4096"> × <input type="number" id="nH" min="16" max="4096"> <button id="bAuto" data-i="auto"></button></div>
  <div class="row"><span style="width:130px" data-i="bySys"></span><select id="selSys"><option value="" data-i="pickSys"></option></select></div>
  <div class="row"><span style="width:130px" data-i="outRes"></span><input type="number" id="oW" min="64" max="8192"> × <input type="number" id="oH" min="64" max="8192"></div>
  <div class="row"><span style="width:130px" data-i="quick"></span>
    <select id="selScreen"><option value="" data-i="pickH"></option><option value="2160">4K (2160)</option><option value="1440">QHD (1440)</option><option value="1080">FHD / Ally (1080)</option><option value="720">720</option></select>
    <select id="selAspect"><option value="4:3">4:3</option><option value="par" data-i="arPar"></option><option value="8:7" data-i="ar87"></option><option value="3:4" data-i="ar34"></option></select>
    <button id="bApplyScr" data-i="apply"></button></div>
  <div class="row"><label><input type="checkbox" id="cRot"> <span data-i="rot"></span></label></div>
  <p data-i="rotP"></p>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button id="bSizeOk" data-i="close"></button></div>
</dialog>

<dialog id="dlgSys">
  <h3 data-i="askTitle"></h3>
  <p id="askP"></p>
  <div class="row"><select id="askSel"></select></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px;flex-wrap:wrap">
    <button id="askKeep" data-i="askKeep"></button><button id="askCrop" data-i="crop"></button><button id="askOk" class="on" data-i="askOk"></button></div>
</dialog>

<dialog id="dlgSave">
  <h3 data-i="save"></h3>
  <p data-i="whereQ" style="color:var(--text);margin-bottom:4px"></p>
  <label class="where"><input type="radio" name="where" value="shaders" checked> <span data-ih="wShaders"></span></label>
  <label class="where"><input type="radio" name="where" value="slang"> <span data-ih="wSlang"></span></label>
  <label class="where"><input type="radio" name="where" value="preset"> <span data-ih="wPreset"></span></label>
  <p id="saveHow"></p>
  <div class="row"><input type="text" id="saveName"></div>
  <pre id="savePrev"></pre>
  <div class="row" style="justify-content:flex-end"><button id="bSaveCancel" data-i="cancel"></button><button id="bSaveGo" class="on" data-i="saveGo"></button></div>
</dialog>

<script>
"use strict";
const PASSES = __PASSES__;
const PARAMS = __PARAMS__;
const PRESETS = __PRESETS__;
const VER = "__VER__";
const SAMPLE = "__SAMPLE__";
// a shared link: #preset=4k-ps1&GLOW=0.3 …
const SHARED = (() => {
  try {
    const q = new URLSearchParams(location.hash.slice(1)), k = q.get('preset'); if (!k) return null;
    const key = k + '.slangp'; if (!(key in PRESETS)) return null;
    const vals = {}; for (const [n, v] of q) if (n !== 'preset' && PARAMS.some(p => p.name === n) && !isNaN(+v)) vals[n] = +v;
    return {key, vals};
  } catch (e) { return null; }
})();

// ---- UI text in two languages. English is the default outside Korean browsers.
const TXT = {

  import:".slangp 불러오기", save:".slangp 저장", png:"이미지 저장", zoom:"배율", fit:"맞춤", view:"보기",

  lOrig:"원본", lRef:"셰이더 화면", lDiff:"차이", size:"화면 크기·입력 설정", find:"쓰인 프리셋 찾기",
  findTip:"셰이더 화면과 가장 비슷한 프리셋을 찾습니다", result:"결과", capOrig:"원본", capRef:"RetroArch 셰이더 화면", capDiff:"차이 (×4)",
  eTitle:"RetroArch 스크린샷을 끌어다 놓으세요",

  natRes:"게임 원래 해상도", outRes:"결과 화면 크기", quick:"빠른 선택", pickH:"높이 선택…", auto:"자동",

  iGame:"게임 해상도 <b>{0}</b>", iFound:" ({0} 화면에서 찾음)", iOut:"결과 <b>{0}</b>", iVert:" · 세로 게임",

// ================= .slangp import / export =================
function parseSlangp(txt) {
  const vals = {};
  for (const m of txt.matchAll(/^\s*(\w+)\s*=\s*"?([-\d.]+)"?\s*$/gm)) if (m[1] in defaults) vals[m[1]] = +m[2];
  const ref = (txt.match(/#reference\s+"([^"]+)"/) || [])[1];
  return {vals, ref: ref ? ref.split(/[\\/]/).pop() : null};
}
// Where the file will be dropped decides the path to the shader:
//  shaders : RetroArch/shaders/            -> points straight at the shader, every value written out
//  slang   : RetroArch/shaders/shaders_slang/ -> same, one folder shorter
//  preset  : next to the chosen preset (presets/4K or presets/Ally) -> only the values changed from that preset
const WHERE_REF = {shaders: 'shaders_slang/real-crt-phosphor/real-crt-phosphor.slangp', slang: 'real-crt-phosphor/real-crt-phosphor.slangp'};
function exportText(where) {
  where = where || 'preset';
  const p = PRESETS[S.presetKey];
  const vs = q => S.vals[q.name] ?? q.d;
  const head = `# Made with Real CRT Phosphor Preview ${VER}.\n`;
  if (where !== 'preset') {   // self-contained: everything that differs from the shader's own defaults
    const all = PARAMS.filter(q => !isHeader(q) && Math.abs(vs(q) - q.d) > 1e-6);
    let t = `#reference "${WHERE_REF[where]}"\n${head}# Started from ${S.presetKey}. Put this file in RetroArch's ${where === 'shaders' ? 'shaders' : 'shaders/shaders_slang'} folder.\n`;
    for (const q of all) t += `${q.name} = "${(+vs(q)).toFixed(6)}"\n`;
    const changed = PARAMS.filter(q => !isHeader(q) && Math.abs(vs(q) - (S.base[q.name] ?? q.d)) > 1e-6).length;
    return {t, n: changed, folder: p.folder, where};
  }
  const diff = PARAMS.filter(q => !isHeader(q) && Math.abs(vs(q) - (S.base[q.name] ?? q.d)) > 1e-6);
  const ref = S.presetKey === 'real-crt-phosphor.slangp' ? '../../real-crt-phosphor.slangp' : S.presetKey;
  let t = `#reference "${ref}"\n${head}# Based on ${S.presetKey}, only the changed values.\n`;
  for (const q of diff) t += `${q.name} = "${(+vs(q)).toFixed(6)}"\n`;
  return {t, n: diff.length, folder: p.folder, where};
}

// ================= PNG export (full size, same as RetroArch screen area) =================

// ================= which preset made the RetroArch shot? =================
let refPix = null;
function refPixels() {

  gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.t, 0);
  gl.readPixels(0, 0, t.w, t.h, gl.RGBA, gl.UNSIGNED_BYTE, px); gl.deleteFramebuffer(fb);

}

  const c = resultCanvas(), r = refPixels();
  if (c.width !== refTex.w || c.height !== refTex.h) return Infinity;
  const a = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  let s = 0, n = 0;
  for (let i = 0; i < a.length; i += 12) { s += Math.abs(a[i] - r[i]) + Math.abs(a[i+1] - r[i+1]) + Math.abs(a[i+2] - r[i+2]); n += 3; }
  return s / n;
}
// RGB triad pitch of the RetroArch shot, measured from how the red-minus-blue light repeats across the screen
function measurePitch() {
  // vertical games are rotated after the shader, so their stripes run along the screen's height
  const r = refPixels(), W = refTex.w, H = refTex.h, L = S.rot ? H : W, prof = new Float64Array(L);
  if (!S.rot) { for (let y = Math.floor(H * 0.2); y < H * 0.8; y += 3) for (let x = 0; x < W; x++) { const i = (y * W + x) * 4; prof[x] += r[i] - r[i+2]; } }
  else { for (let x = Math.floor(W * 0.2); x < W * 0.8; x += 3) for (let y = 0; y < H; y++) { const i = (y * W + x) * 4; prof[y] += r[i] - r[i+2]; } }

  let best = 0, bestP = 0;
  for (let P = 2.5; P <= 12; P += 0.02) {
    let c = 0, q = 0; const w = 2 * Math.PI / P;
    for (let x = 0; x < W2; x++) { const v = prof[x] - m; c += v * Math.cos(w * x); q += v * Math.sin(w * x); }
    const e = c * c + q * q; if (e > best) { best = e; bestP = P; }

}
const pitchOf = v => v.MASK_PITCH < 0.5 ? Math.max(3, Math.floor((S.rot ? S.outW : S.outH) / 2160 * 6 * v.MASK_SIZE + 0.5)) : v.MASK_PITCH;
async function findPreset() {

  const btn0 = $('bFind'), btn = {set textContent(v) { btn0.textContent = v; $('bTools').firstElementChild.textContent = v === t('find') ? t('tools') : v; }, set disabled(v) { btn0.disabled = v; }};
  btn.disabled = true; closeTools();

  for (const k of keys) {

    await new Promise(r => setTimeout(r, 0));

  const lines = res.slice(0, 3).map(([k, v]) => `${k.replace('.slangp', '')}  —  ${t('diffAvg', v.toFixed(2))}`).join('\n');
  const tweaks = Object.keys(extra).length ? '\n' + t('fTweak', Object.entries(extra).map(([k, v]) => `${k} ${v}`).join(', '), sc.toFixed(2)) : '';
  const verdict = sc < 0.6 ? t('fSame') : sc < 3 ? t('fClose') : t('fNone');
  if (confirm(t('fAsk', lines + tweaks, verdict, best.replace('.slangp', '') + (tweaks ? ' + ' + Object.keys(extra).join(', ') : '')))) { S.presetKey = keep.key; S.base = keep.base; S.vals = keep.vals; pushHist(); applyPreset(best, extra); }
  else { S.presetKey = keep.key; S.base = keep.base; S.vals = keep.vals; $('selPreset').value = keep.key; syncPanel(); changed(); }
}

// crop: drag a box around the game picture on the whole capture
const crop = {sel:null, drag:null, scale:1, ox:0, oy:0};
function openCrop() {

function closeCrop() { $('crop').classList.add('hid'); }
function cropPt(e) {

function showCropBox() {

// pull each edge of the box onto the strongest colour edge nearby, so a rough drag still lands on the exact pixel
